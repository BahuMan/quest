<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR Hello</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        color: #edf4ff;
        font-family: Arial, Helvetica, sans-serif;
      }
      .ui {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(11, 16, 32, 0.72);
        border: 1px solid rgba(125, 211, 252, 0.35);
      }
      .ui h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }
      .ui p {
        margin: 0 0 8px;
        font-size: 0.9rem;
        color: #dfeaff;
      }
      .ui a {
        color: #7dd3fc;
        text-decoration: none;
        font-weight: bold;
      }
      .ui a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="ui">
      <h1>VR Hello</h1>
      <p>A simple immersive scene with a floating box and a glowing sky.</p>
      <a href="../index.html">Back to demos</a>
    </div>

    <a-scene embedded vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: true">
      <a-sky color="#87ceeb"></a-sky>
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="point" position="0 4 -2" intensity="1.6" color="#fbbf24"></a-light>

      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#1f2d3d"></a-plane>

      <a-box
        position="0 1.5 -4"
        width="1.2"
        height="1.2"
        depth="1.2"
        color="#7dd3fc"
        opacity="0.9"
        animation="property: rotation; to: 0 360 360; loop: true; dur: 6000; easing: linear"
      ></a-box>

      <a-ring
        position="0 1.5 -4"
        radius-inner="1.2"
        radius-outer="1.5"
        color="#a78bfa"
        opacity="0.8"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear"
      ></a-ring>

      <a-sphere position="-2 2 -6" radius="0.5" color="#fbbf24"></a-sphere>
      <a-sphere position="2 2 -6" radius="0.5" color="#f472b6"></a-sphere>
      <a-sphere position="0 3 -7" radius="0.4" color="#34d399"></a-sphere>

      <a-camera position="0 1.6 4" look-controls wasd-controls></a-camera>
    </a-scene>
  </body>
</html>
