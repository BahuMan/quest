<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prehistoric WebXR Safari</title>
    <!-- Tailwind CSS for UI overlay -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import Maps for Three.js and Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            user-select: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Custom scrollbar & glassmorphism styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pulse-glow {
            animation: pulse-glow-anim 3s infinite alternate;
        }
        @keyframes pulse-glow-anim {
            0% { box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
            100% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.6); }
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- Container for WebGL Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay (HUD) -->
    <div id="ui-overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 md:p-6 z-10">
        <!-- Top Bar Header -->
        <div class="flex justify-between items-start w-full">
            <div class="glass-panel p-4 rounded-2xl pointer-events-auto max-w-sm">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-emerald-500/20 text-emerald-400 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a2.5 2.5 0 002.5-2.5V14.375M19 19.827A9 9 0 0021 12c0-4.97-4.03-9-9-9s-9 4.03-9 9c0 2.12.735 4.07 1.965 5.615"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-white leading-tight">Prehistoric WebXR</h1>
                        <p class="text-xs text-slate-300">Jurassic Valley Explorer</p>
                    </div>
                </div>
                <p class="text-xs text-slate-400 mt-2">
                    Look around, explore dinosaur scale, or enter VR for immersion.
                </p>
            </div>

            <!-- Sound Toggle & Info Buttons -->
            <div class="flex gap-2 pointer-events-auto">
                <button id="audio-toggle" class="glass-panel p-3 rounded-xl hover:bg-slate-800/80 transition-all text-slate-200 hover:text-emerald-400 flex items-center justify-center gap-2">
                    <svg id="audio-off-icon" class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                    </svg>
                    <svg id="audio-on-icon" class="w-5 h-5 text-emerald-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                    </svg>
                    <span class="text-xs font-medium hidden sm:inline" id="audio-text">Audio Off</span>
                </button>
            </div>
        </div>

        <!-- Target Dino Information Card (Appears on Selection or Hover) -->
        <div id="dino-info-card" class="glass-panel p-4 rounded-2xl pointer-events-auto max-w-sm self-center sm:self-start transition-all transform duration-300 opacity-0 translate-y-4">
            <div class="flex justify-between items-center mb-1">
                <span id="dino-type-badge" class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-300 rounded-full">Herbivore</span>
                <span id="dino-period" class="text-xs text-slate-400">Late Jurassic</span>
            </div>
            <h2 id="dino-name" class="text-xl font-bold text-white mb-1">Brachiosaurus</h2>
            <p id="dino-desc" class="text-xs text-slate-300 leading-relaxed mb-3">
                Massive long-necked dinosaur that grazed on high foliage. Standing over 12 meters tall!
            </p>
            <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-900/50 p-2 rounded-lg">
                <div>Height: <span id="dino-height" class="font-semibold text-white">13 m</span></div>
                <div>Weight: <span id="dino-weight" class="font-semibold text-white">56 Tons</span></div>
            </div>
        </div>

        <!-- Bottom VR Launcher & Controls Bar -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between w-full">
            <!-- Camera Preset Teleport / Focus Buttons -->
            <div class="glass-panel p-1.5 rounded-xl pointer-events-auto flex gap-1 w-full sm:w-auto justify-center">
                <button class="cam-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-600 text-white shadow" data-pos="ground">Ground View</button>
                <button class="cam-btn px-3 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60" data-pos="overview">Valley Overview</button>
                <button class="cam-btn px-3 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60" data-pos="follow">Track Brachio</button>
            </div>

            <!-- VR Button Container Placeholder -->
            <div id="vr-button-container" class="pointer-events-auto flex justify-center"></div>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // Global variables & state
        let scene, camera, renderer, controls;
        let dinosaurs = [];
        let clock = new THREE.Clock();
        let audioContext, ambientGainNode, audioActive = false;
        let selectedDino = null;
        let cameraMode = 'ground'; // 'ground', 'overview', 'follow'

        // Dinosaur Species Configuration Data (Calibrated to 1 unit = ~1 meter real-world scale)
        const DINO_SPECIES = {
            BRACHIO: {
                name: 'Brachiosaurus',
                badge: 'Herbivore',
                badgeColor: 'bg-emerald-500/20 text-emerald-300',
                period: 'Late Jurassic',
                height: '12 - 13 m',
                length: '22 - 26 m',
                weight: '50-60 Tons',
                desc: 'Huge quadrupedal sauropod with a towering neck allowing it to browse high conifers.',
                scale: 1.0,
                speed: 0.12
            },
            TREX: {
                name: 'Tyrannosaurus Rex',
                badge: 'Apex Predator',
                badgeColor: 'bg-rose-500/20 text-rose-300',
                period: 'Late Cretaceous',
                height: '3.7 - 4.0 m',
                length: '12 - 13 m',
                weight: '8 - 9 Tons',
                desc: 'Formidable bipedal carnivore with massive skull, bone-crushing jaws, and terrifying presence.',
                scale: 1.0,
                speed: 0.22
            },
            TRICERA: {
                name: 'Triceratops',
                badge: 'Herbivore',
                badgeColor: 'bg-amber-500/20 text-amber-300',
                period: 'Late Cretaceous',
                height: '3.0 m',
                length: '8 - 9 m',
                weight: '10 Tons',
                desc: 'Heavy-armored three-horned herbivore featuring a broad neck frill designed for defense.',
                scale: 1.0,
                speed: 0.16
            }
        };

        // Raycasting for object selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Application Entry Point
        window.addEventListener('load', () => {
            initScene();
            createEnvironment();
            createDinosaurs();
            setupInteractions();
            setupAudio();
            animate();
        });

        // Initialize Three.js Scene, Camera, WebXR Renderer & Controls
        function initScene() {
            const container = document.getElementById('webgl-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0c4ff);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

            // Camera setup
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 18); // Default human eye level (~1.7 meters)

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            
            // Enable WebXR
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // WebXR VR Button with Fallback Check
            if ('xr' in navigator || VRButton) {
                const vrBtn = VRButton.createButton(renderer);
                document.getElementById('vr-button-container').appendChild(vrBtn);
                
                // Customize WebXR button style slightly to match app design
                vrBtn.style.position = 'static';
                vrBtn.style.padding = '10px 20px';
                vrBtn.style.borderRadius = '12px';
                vrBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                vrBtn.style.border = 'none';
                vrBtn.style.fontWeight = 'bold';
                vrBtn.style.color = '#fff';
                vrBtn.style.boxShadow = '0 4px 14px rgba(16, 185, 129, 0.4)';
            }

            // Orbit Controls fallback for Non-VR
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05; // Prevent camera going under terrain
            controls.minDistance = 2;
            controls.maxDistance = 120;
            controls.target.set(0, 4, 0);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xdff0ff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff3d1, 1.4);
            sunLight.position.set(50, 80, 40);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 250;
            const shadowD = 60;
            sunLight.shadow.camera.left = -shadowD;
            sunLight.shadow.camera.right = shadowD;
            sunLight.shadow.camera.top = shadowD;
            sunLight.shadow.camera.bottom = -shadowD;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3d5a80, 0.4);
            scene.add(hemiLight);

            // Responsive Window Listener
            window.addEventListener('resize', onWindowResize);
        }

        // Generate Terrain, Trees, Mountains, Sky Dome & Environment
        function createEnvironment() {
            // 1. Procedural Terrain Mesh
            const terrainGeo = new THREE.PlaneGeometry(250, 250, 96, 96);
            terrainGeo.rotateX(-Math.PI / 2);

            const pos = terrainGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                // Gentle rolling hills with flat center valley
                const distFromCenter = Math.sqrt(x * x + z * z);
                let height = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2.5;
                height += Math.sin(x * 0.02 + z * 0.03) * 5;
                if (distFromCenter > 70) {
                    height += Math.pow((distFromCenter - 70) * 0.15, 1.8); // Outer mountain ring
                }
                pos.setY(i, Math.max(-0.5, height));
            }
            terrainGeo.computeVertexNormals();

            const terrainMat = new THREE.MeshStandardMaterial({
                color: 0x3a5a40,
                roughness: 0.9,
                metalness: 0.1,
                flatShading: true
            });
            const terrain = new THREE.Mesh(terrainGeo, terrainMat);
            terrain.receiveShadow = true;
            scene.add(terrain);

            // 2. Decorative River / Water Bed
            const riverGeo = new THREE.PlaneGeometry(35, 200);
            riverGeo.rotateX(-Math.PI / 2);
            const riverMat = new THREE.MeshStandardMaterial({
                color: 0x2b6cb0,
                roughness: 0.1,
                metalness: 0.8,
                transparent: true,
                opacity: 0.85
            });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.position.set(-30, 0.2, 0);
            river.rotation.y = 0.2;
            scene.add(river);

            // 3. Foliage: Low Poly Prehistoric Trees & Ferns
            const treeGroup = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9, flatShading: true });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.7, flatShading: true });
            const leafMatDark = new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.7, flatShading: true });

            // Seeded scatter trees
            for (let i = 0; i < 90; i++) {
                const tx = (Math.random() - 0.5) * 180;
                const tz = (Math.random() - 0.5) * 180;
                // Keep clear of center path & water
                if (Math.abs(tx) < 15 && Math.abs(tz) < 15) continue;
                if (tx > -45 && tx < -15) continue;

                const tree = createStylizedTree(trunkMat, i % 2 === 0 ? leafMat : leafMatDark);
                // Sink the tree stem slightly below terrain level to ensure proper grounding on slopes
                tree.position.set(tx, getTerrainHeight(tx, tz) - 0.8, tz);
                const s = 0.7 + Math.random() * 0.8;
                tree.scale.set(s, s + Math.random() * 0.5, s);
                treeGroup.add(tree);
            }
            scene.add(treeGroup);

            // 4. Prehistoric Boulders / Rocks
            const rockGeo = new THREE.DodecahedronGeometry(1.5, 1);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x6c757d, roughness: 0.8, flatShading: true });
            for (let i = 0; i < 40; i++) {
                const rx = (Math.random() - 0.5) * 160;
                const rz = (Math.random() - 0.5) * 160;
                const rock = new THREE.Mesh(rockGeo, rockMat);
                rock.position.set(rx, getTerrainHeight(rx, rz) + 0.5, rz);
                const s = 0.8 + Math.random() * 1.5;
                rock.scale.set(s, s * (0.5 + Math.random() * 0.5), s);
                rock.rotation.set(Math.random(), Math.random(), Math.random());
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }

        // Helper: Simple height estimation for placement on terrain
        function getTerrainHeight(x, z) {
            const dist = Math.sqrt(x * x + z * z);
            let h = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2.5 + Math.sin(x * 0.02 + z * 0.03) * 5;
            if (dist > 70) h += Math.pow((dist - 70) * 0.15, 1.8);
            return Math.max(0, h);
        }

        // Helper: Build stylized low-poly tree
        function createStylizedTree(trunkMat, leafMat) {
            const group = new THREE.Group();
            
            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.7, 6, 5);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 3;
            trunk.castShadow = true;
            group.add(trunk);

            // Palm/Conifer Foliage Cones
            for (let i = 0; i < 3; i++) {
                const leafGeo = new THREE.ConeGeometry(3.5 - i * 0.8, 4, 5);
                const foliage = new THREE.Mesh(leafGeo, leafMat);
                foliage.position.y = 5 + i * 2;
                foliage.castShadow = true;
                group.add(foliage);
            }
            return group;
        }

        // Generate Procedural Low-Poly Dinosaurs with Rigging/Animation Structure
        function createDinosaurs() {
            // 1. BRACHIOSAURUS (Huge Sauropod - Total Height ~12.5m, Length ~22m)
            const brachioGroup = buildBrachiosaurus();
            const brachioObj = {
                mesh: brachioGroup,
                data: DINO_SPECIES.BRACHIO,
                pathRadius: 35,
                pathOffset: 0,
                speed: DINO_SPECIES.BRACHIO.speed,
                limbs: brachioGroup.userData.limbs,
                neck: brachioGroup.userData.neck,
                tail: brachioGroup.userData.tail
            };
            dinosaurs.push(brachioObj);
            scene.add(brachioGroup);

            // 2. T-REX (Apex Carnivore - Hip Height ~3.8m, Total Length ~12m)
            const trexGroup = buildTrex();
            const trexObj = {
                mesh: trexGroup,
                data: DINO_SPECIES.TREX,
                pathRadius: 22,
                pathOffset: Math.PI * 0.7,
                speed: DINO_SPECIES.TREX.speed,
                limbs: trexGroup.userData.limbs,
                tail: trexGroup.userData.tail
            };
            dinosaurs.push(trexObj);
            scene.add(trexGroup);

            // 3. TRICERATOPS (Horned Herbivore - Height ~3.0m, Length ~8.5m)
            const triceratopsGroup = buildTriceratops();
            const triceratopsObj = {
                mesh: triceratopsGroup,
                data: DINO_SPECIES.TRICERA,
                pathRadius: 15,
                pathOffset: Math.PI * 1.4,
                speed: DINO_SPECIES.TRICERA.speed,
                limbs: triceratopsGroup.userData.limbs,
                head: triceratopsGroup.userData.head
            };
            dinosaurs.push(triceratopsObj);
            scene.add(triceratopsGroup);
        }

        // Procedural Mesh Builder: Brachiosaurus (Calibrated to ~12.5m head height, ~22m length)
        function buildBrachiosaurus() {
            const root = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a5d4e, roughness: 0.8, flatShading: true });
            const bellyMat = new THREE.MeshStandardMaterial({ color: 0x718374, roughness: 0.8, flatShading: true });

            // Torso (Length: 7.5m, Height: 4.5m)
            const bodyGeo = new THREE.BoxGeometry(4.8, 4.5, 7.5);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 6.2;
            body.castShadow = true;
            root.add(body);

            // Massive Neck (Length: 8.5m reaching up to ~12.5m)
            const neckGroup = new THREE.Group();
            neckGroup.position.set(0, 7.8, 2.8);
            
            const neckGeo = new THREE.CylinderGeometry(0.9, 1.7, 8.5, 6);
            const neckMesh = new THREE.Mesh(neckGeo, bodyMat);
            neckMesh.position.set(0, 3.8, 1.2);
            neckMesh.rotation.x = 0.3;
            neckMesh.castShadow = true;
            neckGroup.add(neckMesh);

            // Head
            const headGeo = new THREE.BoxGeometry(1.4, 1.2, 2.2);
            const head = new THREE.Mesh(headGeo, bellyMat);
            head.position.set(0, 8.0, 2.6);
            head.castShadow = true;
            neckGroup.add(head);

            root.add(neckGroup);

            // Seamless Tail Group attached directly to rear pelvis/body (Length: ~9m)
            const tailGroup = new THREE.Group();
            tailGroup.position.set(0, 5.8, -3.5); // Attached flush to back edge of torso

            const tailGeo = new THREE.CylinderGeometry(0.4, 1.8, 9.0, 6);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(0, -0.8, -4.2); // Offset along pivot length
            tail.rotation.x = -1.75;
            tail.castShadow = true;
            tailGroup.add(tail);
            root.add(tailGroup);

            // Legs (4 Quadruped Legs)
            const limbs = [];
            const legPositions = [
                { x: -2.1, y: 0, z: 2.2 },  // Front Left
                { x: 2.1, y: 0, z: 2.2 },   // Front Right
                { x: -2.1, y: 0, z: -2.2 },  // Back Left
                { x: 2.1, y: 0, z: -2.2 }    // Back Right
            ];

            legPositions.forEach((pos) => {
                const legPivot = new THREE.Group();
                legPivot.position.set(pos.x, 4.2, pos.z);
                
                const legGeo = new THREE.CylinderGeometry(0.85, 0.95, 4.2, 6);
                const legMesh = new THREE.Mesh(legGeo, bodyMat);
                legMesh.position.y = -2.1;
                legMesh.castShadow = true;
                legPivot.add(legMesh);

                root.add(legPivot);
                limbs.push(legPivot);
            });

            root.userData = { limbs, neck: neckGroup, tail: tailGroup, type: 'BRACHIO' };
            return root;
        }

        // Procedural Mesh Builder: T-Rex (Calibrated to ~3.8m hip height, ~12m total length)
        function buildTrex() {
            const root = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7, flatShading: true });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x5c2c0e, roughness: 0.8, flatShading: true });
            const toothMat = new THREE.MeshStandardMaterial({ color: 0xfffff0, roughness: 0.3 });

            // Main Body/Chest (Length ~3.8m)
            const bodyGeo = new THREE.BoxGeometry(2.0, 2.2, 3.8);
            const body = new THREE.Mesh(bodyGeo, skinMat);
            body.position.set(0, 3.8, 0);
            body.rotation.x = 0.15;
            body.castShadow = true;
            root.add(body);

            // Massive Skull
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 4.5, 1.8);

            const skullGeo = new THREE.BoxGeometry(1.5, 1.6, 2.6);
            const skull = new THREE.Mesh(skullGeo, darkMat);
            skull.position.set(0, 0.4, 0.9);
            skull.castShadow = true;
            headGroup.add(skull);

            // Jaw
            const jawGeo = new THREE.BoxGeometry(1.3, 0.5, 2.3);
            const jaw = new THREE.Mesh(jawGeo, skinMat);
            jaw.position.set(0, -0.4, 0.9);
            jaw.rotation.set(0.5, 0, 0);
            headGroup.add(jaw);

            // Teeth detail
            for(let t = -0.5; t <= 0.5; t += 0.5) {
                const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 4), toothMat);
                tooth.position.set(t * 0.8, -0.15, 2.0);
                tooth.rotation.x = Math.PI;
                headGroup.add(tooth);
            }

            root.add(headGroup);

            // Counterweight Tail (Length ~6m)
            const tailGroup = new THREE.Group();
            const tailGeo = new THREE.CylinderGeometry(0.25, 0.9, 6.0, 5);
            const tail = new THREE.Mesh(tailGeo, skinMat);
            tail.position.set(0, 3.2, -3.8);
            tail.rotation.x = -1.85;
            tail.castShadow = true;
            tailGroup.add(tail);
            root.add(tailGroup);

            // Powerful Bipedal Legs
            const limbs = [];
            [-1.1, 1.1].forEach((xPos) => {
                const legPivot = new THREE.Group();
                legPivot.position.set(xPos, 3.6, -0.3);

                const thighGeo = new THREE.CylinderGeometry(0.65, 0.45, 2.4, 6);
                const thigh = new THREE.Mesh(thighGeo, skinMat);
                thigh.position.set(0, -1.2, 0);
                thigh.rotation.x = -0.3;
                thigh.castShadow = true;
                legPivot.add(thigh);

                const shinGeo = new THREE.CylinderGeometry(0.4, 0.3, 2.4, 6);
                const shin = new THREE.Mesh(shinGeo, darkMat);
                shin.position.set(0, -3.0, 0.0);
                shin.rotation.x = 0.4;
                shin.castShadow = true;
                legPivot.add(shin);

                root.add(legPivot);
                limbs.push(legPivot);
            });

            // Tiny Arms
            [-0.9, 0.9].forEach(x => {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.9), darkMat);
                arm.position.set(x, 4.0, 1.3);
                arm.rotation.x = 0.8;
                root.add(arm);
            });

            root.userData = { limbs, tail: tailGroup, type: 'TREX' };
            return root;
        }

        // Procedural Mesh Builder: Triceratops (Calibrated to ~3.0m total height, ~8.5m length)
        function buildTriceratops() {
            const root = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9c6644, roughness: 0.8, flatShading: true });
            const frillMat = new THREE.MeshStandardMaterial({ color: 0x7f4f24, roughness: 0.8, flatShading: true });
            const hornMat = new THREE.MeshStandardMaterial({ color: 0xe9ecef, roughness: 0.4 });

            // Torso
            const bodyGeo = new THREE.BoxGeometry(2.6, 2.2, 4.2);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 2.4;
            body.castShadow = true;
            root.add(body);

            // Head & Frill Group
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 2.5, 2.1);

            const headGeo = new THREE.BoxGeometry(1.5, 1.3, 1.8);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.z = 0.6;
            headGroup.add(head);

            // Large Shield Frill
            const frillGeo = new THREE.CylinderGeometry(1.7, 0.9, 0.3, 8);
            const frill = new THREE.Mesh(frillGeo, frillMat);
            frill.position.set(0, 1.0, -0.2);
            frill.rotation.x = 0.6;
            frill.castShadow = true;
            headGroup.add(frill);

            // 3 Horns
            const browHornGeo = new THREE.ConeGeometry(0.16, 1.7, 5);
            [-0.5, 0.5].forEach(x => {
                const horn = new THREE.Mesh(browHornGeo, hornMat);
                horn.position.set(x, 0.7, 1.3);
                horn.rotation.x = 1.1;
                headGroup.add(horn);
            });

            const noseHorn = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.8, 5), hornMat);
            noseHorn.position.set(0, 0.15, 1.7);
            noseHorn.rotation.x = 0.8;
            headGroup.add(noseHorn);

            root.add(headGroup);

            // Quadruped Legs
            const limbs = [];
            [
                { x: -1.2, z: 1.4 }, { x: 1.2, z: 1.4 },
                { x: -1.2, z: -1.4 }, { x: 1.2, z: -1.4 }
            ].forEach(pos => {
                const legPivot = new THREE.Group();
                legPivot.position.set(pos.x, 1.8, pos.z);

                const legGeo = new THREE.CylinderGeometry(0.45, 0.4, 2.0, 6);
                const leg = new THREE.Mesh(legGeo, bodyMat);
                leg.position.y = -1.0;
                leg.castShadow = true;
                legPivot.add(leg);

                root.add(legPivot);
                limbs.push(legPivot);
            });

            root.userData = { limbs, head: headGroup, type: 'TRICERA' };
            return root;
        }

        // Interactive Handlers & Raycasting
        function setupInteractions() {
            const container = renderer.domElement;

            // Pointer / Tap click detector
            container.addEventListener('pointerdown', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    // Traverse up to find root dinosaur group
                    while (obj.parent && obj.parent !== scene) {
                        obj = obj.parent;
                    }
                    
                    const foundDino = dinosaurs.find(d => d.mesh === obj);
                    if (foundDino) {
                        selectDino(foundDino);
                    }
                }
            });

            // Camera View Preset Buttons
            document.querySelectorAll('.cam-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.cam-btn').forEach(b => {
                        b.classList.remove('bg-emerald-600', 'text-white');
                        b.classList.add('text-slate-300');
                    });
                    e.target.classList.add('bg-emerald-600', 'text-white');
                    e.target.classList.remove('text-slate-300');

                    const posType = e.target.getAttribute('data-pos');
                    cameraMode = posType;
                    updateCameraPreset(posType);
                });
            });
        }

        // Set Camera Position & Target Based on Preset Mode
        function updateCameraPreset(mode) {
            if (mode === 'ground') {
                // Low angle looking up at dinosaurs for awe-inspiring scale
                camera.position.set(0, 1.7, 18);
                controls.target.set(0, 6, 0);
            } else if (mode === 'overview') {
                // Aerial panoramic overview of Jurassic valley
                camera.position.set(0, 45, 65);
                controls.target.set(0, 0, 0);
            } else if (mode === 'follow') {
                // Focus camera directly on Brachiosaurus
                const brachio = dinosaurs.find(d => d.data.name === 'Brachiosaurus');
                if (brachio) {
                    selectDino(brachio);
                }
            }
        }

        // Select Dinosaur and display detail HUD card
        function selectDino(dinoObj) {
            selectedDino = dinoObj;
            const data = dinoObj.data;

            const card = document.getElementById('dino-info-card');
            document.getElementById('dino-name').innerText = data.name;
            document.getElementById('dino-desc').innerText = data.desc;
            document.getElementById('dino-height').innerText = data.height;
            document.getElementById('dino-weight').innerText = data.weight;
            document.getElementById('dino-period').innerText = data.period;

            const badge = document.getElementById('dino-type-badge');
            badge.innerText = data.badge;
            badge.className = `px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-full ${data.badgeColor}`;

            // Reveal card
            card.classList.remove('opacity-0', 'translate-y-4');
            card.classList.add('opacity-100', 'translate-y-0');

            // Play procedural dinosaur roar sound effect
            playRoarSound(data.name);
        }

        // Procedural Audio Engine (Web Audio API - Synthesizing Jungle Ambience & Roars)
        function setupAudio() {
            const toggleBtn = document.getElementById('audio-toggle');
            toggleBtn.addEventListener('click', () => {
                if (!audioActive) {
                    initAudioContext();
                    audioActive = true;
                    document.getElementById('audio-off-icon').classList.add('hidden');
                    document.getElementById('audio-on-icon').classList.remove('hidden');
                    document.getElementById('audio-text').innerText = 'Audio On';
                } else {
                    if (audioContext) audioContext.suspend();
                    audioActive = false;
                    document.getElementById('audio-off-icon').classList.remove('hidden');
                    document.getElementById('audio-on-icon').classList.add('hidden');
                    document.getElementById('audio-text').innerText = 'Audio Off';
                }
            });
        }

        function initAudioContext() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();

            // Ambient background wind/jungle hum node
            const bufferSize = audioContext.sampleRate * 2;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioContext.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 350;

            ambientGainNode = audioContext.createGain();
            ambientGainNode.gain.value = 0.08;

            whiteNoise.connect(filter);
            filter.connect(ambientGainNode);
            ambientGainNode.connect(audioContext.destination);

            whiteNoise.start();
        }

        // Synthesize dynamic low-pitched creature roars without external asset dependencies
        function playRoarSound(dinoType) {
            if (!audioActive || !audioContext) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            const now = audioContext.currentTime;

            if (dinoType === 'Tyrannosaurus Rex') {
                // Pitch drop roar
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 1.2);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.3);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioContext.destination);

                osc.start(now);
                osc.stop(now + 1.3);
            } else {
                // Deep rumbles for Sauropods/Triceratops
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(90, now);
                osc.frequency.linearRampToValueAtTime(50, now + 1.8);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start(now);
                osc.stop(now + 2.0);
            }
        }

        // Main Animation & Render Loop (WebXR Compatible)
        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Update Dinosaurs Walking Procedurally along Orbital Paths
            dinosaurs.forEach((dino) => {
                // Calculate circular walking trajectory
                const angle = time * dino.speed * 0.15 + dino.pathOffset;
                const x = Math.sin(angle) * dino.pathRadius;
                const z = Math.cos(angle) * dino.pathRadius;
                const y = getTerrainHeight(x, z);

                dino.mesh.position.set(x, y, z);

                // Orient dinosaur along tangent vector facing forward direction
                const nextAngle = angle + 0.05;
                const nextX = Math.sin(nextAngle) * dino.pathRadius;
                const nextZ = Math.cos(nextAngle) * dino.pathRadius;
                dino.mesh.lookAt(nextX, y, nextZ);

                // Animate leg quadruped/biped walk cycle
                const walkCycle = Math.sin(time * dino.speed * 8);
                if (dino.limbs) {
                    dino.limbs.forEach((leg, idx) => {
                        const offset = (idx % 2 === 0) ? 1 : -1;
                        leg.rotation.x = walkCycle * 0.35 * offset;
                    });
                }

                // Animate neck or tail idle sway
                if (dino.neck) {
                    dino.neck.rotation.z = Math.sin(time * 1.2) * 0.08;
                    dino.neck.rotation.x = Math.cos(time * 0.8) * 0.05;
                }
                if (dino.tail) {
                    dino.tail.rotation.y = Math.sin(time * dino.speed * 12.5) * 0.15;
                }
            });

            // Smooth Orbit Controls Follow target if camera mode is set to tracking
            if (cameraMode === 'follow' && selectedDino) {
                const targetPos = selectedDino.mesh.position.clone();
                targetPos.y += 4;
                controls.target.lerp(targetPos, 0.05);
            }

            // Update fallback orbit controls outside WebXR VR session
            if (!renderer.xr.isPresenting) {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        // Handle Responsive Resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
